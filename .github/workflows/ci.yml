name: CI

on:
  pull_request:
    branches: [main, development]

jobs:
  # Build check - runs for all PRs
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./src
        run: bun install

      # Runtime calculation tests (src/tests, bun test)
      - name: Unit tests
        working-directory: ./src
        run: bun test

      - name: Build
        working-directory: ./src
        run: bun run build

  # End-to-end suite (docs/e2e-testing-spec.md) against a local Supabase
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./src
        run: bun install

      - name: Install Playwright browsers
        working-directory: ./src
        run: bunx playwright install --with-deps chromium webkit

      # signing_keys.json is gitignored; generate a throwaway key for this run.
      - name: Generate local JWT signing key
        working-directory: ./src
        run: |
          echo "[]" > ../supabase/signing_keys.json
          bunx supabase gen signing-key --algorithm ES256 --append --workdir ..

      - name: Start local Supabase
        working-directory: ./src
        run: bunx supabase start --workdir .. -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      # Database calculation tests (supabase/tests, pgTAP)
      - name: Database tests
        working-directory: ./src
        run: bun run test:db

      - name: Run E2E suite
        working-directory: ./src
        run: bun run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/playwright-report/
          retention-days: 14

  # Preview deployment - only for PRs to main
  preview:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build Preview
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy Preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployment Ready!**\n\n[View Preview](${{ steps.deploy.outputs.url }})`
            })
